name: Build Android debug APK

on:
  workflow_dispatch:
  push:
    paths:
      - "artifacts/window-cleaning-quotes/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: artifacts/window-cleaning-quotes/android/**/*.gradle*

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app and sync Capacitor
        run: pnpm --filter @workspace/window-cleaning-quotes run android:sync

      - name: Build debug APK
        working-directory: artifacts/window-cleaning-quotes/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Give APK a clear filename
        run: cp artifacts/window-cleaning-quotes/android/app/build/outputs/apk/debug/app-debug.apk window-quote-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: window-quote-debug
          path: window-quote-debug.apk
          if-no-files-found: error
          retention-days: 14
