name: Build Android debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "artifacts/window-cleaning-quotes/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "lib/**"
      - "scripts/**"
      - ".github/workflows/build-apk.yml"
      - ".github/workflows/deploy-pwa.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: artifacts/window-cleaning-quotes/android/**/*.gradle*

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and sync Android app
        run: pnpm --filter @workspace/window-cleaning-quotes run android:build

      - name: Give APK a clear filename
        run: cp artifacts/window-cleaning-quotes/android/app/build/outputs/apk/debug/app-debug.apk window-quote-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: window-quote-debug
          path: window-quote-debug.apk
          if-no-files-found: error
          retention-days: 14
